name: Build RWZReader

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup NuGet (для восстановления пакетов, если они есть)
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore sourceCode\RWZReader.sln

    - name: Build solution
      run: msbuild sourceCode\RWZReader.sln /p:Configuration=Release

    - name: Upload RWZReader.exe
      uses: actions/upload-artifact@v3
      with:
        name: RWZReader
        path: sourceCode\bin\Release\RWZReader.exe
